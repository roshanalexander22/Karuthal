name: sahaayi
description: AI-powered elderly assistance and accessibility platform
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP & networking
  dio: ^5.4.3+1

  # Local storage
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # File handling
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Audio
  just_audio: ^0.9.39
  record: ^5.1.1
  flutter_tts: ^4.0.2

  # Notifications
  flutter_local_notifications: ^17.2.1+1
  firebase_messaging: ^15.1.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  logger: ^2.4.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^9.7.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  # Asset directories and custom font files to be added during Phase 2
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  # fonts:
