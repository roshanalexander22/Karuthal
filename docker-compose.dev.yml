version: '3.8'

# Development overrides for local hot-reloading and visual inspection
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - DEBUG=true
    volumes:
      - ./ai-engine:/app
      - ai-models-cache:/root/.cache

  adminer:
    image: adminer:4
    container_name: sahaayi-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sahaayi-network
