name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sahaayi_db
          POSTGRES_USER: sahaayi_user
          POSTGRES_PASSWORD: sahaayi_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://sahaayi_user:sahaayi_secure_password@localhost:5432/sahaayi_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars-long
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
        run: |
          cd backend
          pytest tests/ -v
