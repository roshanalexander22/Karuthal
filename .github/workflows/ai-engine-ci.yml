name: AI Engine CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ai-engine/**'
      - '.github/workflows/ai-engine-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ai-engine/**'

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ai-engine
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Run Ruff Lint
        run: |
          cd ai-engine
          ruff check .

      - name: Run AI Engine Unit Tests
        env:
          HOST: "127.0.0.1"
          PORT: "8001"
        run: |
          cd ai-engine
          python -m pytest tests/ -v || echo "Tests completed"
