name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/mobile/**'

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd frontend/mobile
          flutter pub get

      - name: Analyze code
        run: |
          cd frontend/mobile
          flutter analyze --no-fatal-infos

      - name: Run Widget & Unit Tests
        run: |
          cd frontend/mobile
          flutter test
